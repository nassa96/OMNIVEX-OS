<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ATLAS TERMINAL V2</title>

  <style>
    body {
      margin: 0;
      background: #05070a;
      color: #d1d5db;
      font-family: monospace;
      display: grid;
      grid-template-columns: 1fr 340px;
      height: 100vh;
      overflow: hidden;
    }

    #main {
      padding: 16px;
      overflow-y: auto;
    }

    #sidebar {
      border-left: 1px solid #1f2937;
      padding: 12px;
      overflow-y: auto;
      background: #0a0f14;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      border: 1px solid #1f2937;
      padding: 10px;
      border-radius: 8px;
      background: #0b1220;
    }

    .BUY { color: #00ff99; }
    .SELL { color: #ff4d4d; }
    .HOLD { color: #facc15; }

    .low { border-left: 3px solid #00ff99; }
    .medium { border-left: 3px solid #facc15; }
    .high { border-left: 3px solid #ff4d4d; }

    .log {
      font-size: 12px;
      border-bottom: 1px solid #111827;
      padding: 4px 0;
    }

    h2, h3 {
      margin: 6px 0;
    }
  </style>
</head>

<body>

  <div id="main">
    <h2>ATLAS TERMINAL V2</h2>
    <div id="grid" class="grid"></div>
  </div>

  <div id="sidebar">
    <h3>EXECUTION TAPE</h3>
    <div id="log"></div>
  </div>

  <script src="./ui.js"></script>

</body>
</html>
